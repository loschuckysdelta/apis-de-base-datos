<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>CHUCKY · Acceso al historial</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#261536,#090e16 65%);color:#e7eaf2;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.card{width:min(450px,100%);padding:30px;background:#101824;border:1px solid #36435b;border-radius:16px;box-shadow:0 18px 50px #0007}.brand{color:#cca6ef;font-size:12px;letter-spacing:.16em;font-weight:900}h1{font-size:26px;margin:12px 0}p{color:#abb9cf;line-height:1.65;font-size:14px}label{display:block;margin-top:22px;margin-bottom:9px;font-size:13px;font-weight:700}input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid #435776;background:#0a111a;color:white;font:inherit}input:focus{outline:2px solid #9c65bf}button{margin-top:17px;border:0;border-radius:9px;padding:13px 16px;width:100%;background:#790699;color:white;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{color:#ffacb6}a{color:#cda8f3}
</style></head><body>
<main class="card"><div class="brand">CHUCKY · ADMINISTRADOR</div><h1>Acceso al historial de keys</h1><p>Este ingreso protege las listas de códigos generados y canjeados. Una vez dentro, el panel solo permitirá consultarlos.</p>
<form id="login"><label for="clave">Contraseña de acceso al panel</label><input id="clave" type="password" autocomplete="current-password" required maxlength="256" placeholder="Contraseña de administrador"><button id="submit" type="submit">Ver historial de keys</button></form>
<p id="mensaje" role="status" aria-live="polite"></p><p><a href="/index.html">Volver al panel CHUCKY</a></p></main>
<script>
document.getElementById('login').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit');const message=document.getElementById('mensaje');button.disabled=true;message.textContent='Validando acceso…';message.className='';try{const response=await fetch('/api/keys/panel/entrar',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({clave:document.getElementById('clave').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'No se pudo iniciar sesión');document.getElementById('clave').value='';location.replace('/keys-historial.html')}catch(error){message.textContent=error.message;message.className='error'}finally{button.disabled=false}});
</script></body></html>
