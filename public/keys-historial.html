<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Historial de Keys · CHUCKY</title><style>body{background:#0d0a15;color:#fff;font:15px system-ui;margin:0;padding:24px}main{max-width:950px;margin:auto}h1{font-size:26px}button,select,input{font:inherit;color:#fff;background:#2a1641;border:1px solid #5c357f;border-radius:8px;padding:10px;cursor:pointer}button{background:#790699}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:12px;border-bottom:1px solid #3e3150}td{word-break:break-all}.menu{display:flex;gap:10px;align-items:center;flex-wrap:wrap}small{color:#c3b4d1}a{color:#d8a5ff}</style></head><body><main><h1>Historial de keys</h1><p>El historial solo se muestra con una sesión válida del panel.</p><div class="menu"><select id="estado"><option value="generadas">Generadas</option><option value="canjeadas">Canjeadas</option></select><input id="buscar" placeholder="Buscar código" maxlength="100"><button id="cargar">Consultar</button><button id="salir">Cerrar sesión</button><a href="/login.html">Panel principal</a></div><p id="notice" role="status"></p><div style="overflow-x:auto"><table><thead><tr><th>Key</th><th>Estado</th><th>Creación</th><th>Canje</th></tr></thead><tbody id="items"></tbody></table></div></main>
<script>const $=s=>document.querySelector(s);async function load(){const params=new URLSearchParams({estado:$('#estado').value,buscar:$('#buscar').value.trim(),page:'1',limit:'100'});$('#notice').textContent='Consultando...';try{const resp=await fetch('/api/keys/listar?'+params,{cache:'no-store'});const data=await resp.json();if(resp.status===401){location.replace('/keys-acceso.html');return}if(!resp.ok)throw Error(data.error||'Error');$('#items').replaceChildren();for(const item of data.items){const tr=document.createElement('tr');for(const val of [item.key,item.estado,new Date(item.createdAt).toLocaleString('es-PE'),item.redeemedAt?new Date(item.redeemedAt).toLocaleString('es-PE'):'—']){const td=document.createElement('td');td.textContent=val;tr.append(td)}$('#items').append(tr)}$('#notice').textContent=`${data.total} keys (${data.items.length} mostradas)`}catch(e){$('#notice').textContent=e.message}}$('#cargar').addEventListener('click',load);$('#salir').addEventListener('click',async()=>{await Promise.all([fetch('/api/keys/panel/salir',{method:'POST'}),fetch('/api/admin/logout',{method:'POST'})]);location.replace('/keys-acceso.html')});load();</script></body></html>
